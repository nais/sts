bindAddress: :8080
internalBindAddress: :8081
databaseUrl: postgres://postgres:postgres@localhost:5432/sts?sslmode=disable
logLevel: info
logFormat: text

authorizationServer:
  issuer: http://localhost:8080
  # Client assertions and registration bearer tokens use this as their sole audience.
  expectedAudience: nais
  externalIssuers:
    name1: http://localhost:3004/subject1
    name2: http://localhost:3004/subject2
  tokenExpiry: "1h"
  environments:
    - name: dev-fss # required
      clientAuthConfig:
        - issuer: http://nais.io/issuer1 # required
          alias: nais
          requireClientID: true

        - issuer: http://localhost:3004/env1 # required
          alias: kubernetes
          clientIDClaims:
            namespace: "kubernetes.io.namespace"
            name: "kubernetes.io.serviceaccount.name"

      registrator: # required
        subject: system:serviceaccount:namespace1:client-registrator # required
        registratorJwksUri: http://localhost:3004/env1/jwks # required
        signingAlg: ES256 # required
    - name: dev-gcp
      clientAuthConfig:
        - issuer: http://localhost:3004/env2
          alias: kubernetes
          clientIDClaims:
            namespace: "kubernetes.io.namespace"
            name: "kubernetes.io.serviceaccount.name"
      registrator:
        subject: system:serviceaccount:namespace1:client-registrator
        registratorJwksUri: http://localhost:3004/env2/jwks
        signingAlg: ES256
