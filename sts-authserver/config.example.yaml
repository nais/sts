bindAddress: :8080
internalBindAddress: :8081
databaseUrl: postgres://postgres:postgres@localhost:5432/sts?sslmode=disable
logLevel: info
logFormat: text

authorizationServer:
  issuer: http://localhost:8080
  # Client assertions and registration bearer tokens use this as their sole audience.
  expectedAudience: nais
  externalIssuers:
    name1: http://localhost:3004/subject1
    name2: http://localhost:3004/subject2
  tokenExpiry: "1h"
  clientAuthIssuers:
    cluster-fss:
      issuer: http://localhost:3004/env1
      alias: kubernetes
      mode: workload
      clientClaims:
        namespace: kubernetes.io.namespace
        name: kubernetes.io.serviceaccount.name
    cluster-gcp:
      issuer: http://localhost:3004/env2
      alias: kubernetes
      mode: workload
      clientClaims:
        namespace: kubernetes.io.namespace
        name: kubernetes.io.serviceaccount.name
    # Shared across environments; each client must also allow the issuer/subject pair.
    employee:
      issuer: https://identity.example.com
      alias: employee
      mode: impersonation
  environments:
    - name: dev-fss
      clientAuthIssuers: [cluster-fss, employee]
      registrator:
        issuerRef: cluster-fss
        subject: system:serviceaccount:namespace1:client-registrator
        registratorJwksUri: http://localhost:3004/env1/jwks
        signingAlg: ES256
    - name: dev-gcp
      clientAuthIssuers: [cluster-gcp, employee]
      registrator:
        issuerRef: cluster-gcp
        subject: system:serviceaccount:namespace1:client-registrator
        registratorJwksUri: http://localhost:3004/env2/jwks
        signingAlg: ES256
