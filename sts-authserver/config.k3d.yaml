bindAddress: :8080
internalBindAddress: :8081
databaseUrl: postgres://postgres:postgres@localhost:5432/sts?sslmode=disable
additionalCAFile: ../sts-operator/.local/ca.crt
logLevel: info
logFormat: text

authorizationServer:
  issuer: http://localhost:8080
  expectedAudience: nais
  externalIssuers:
    name1: http://localhost:3004/subject1
  clientAuthIssuers:
    cluster-local:
      issuer: https://127.0.0.1:6553
      alias: kubernetes
      mode: workload
      clientClaims:
        namespace: kubernetes.io.namespace
        name: kubernetes.io.serviceaccount.name
    people:
      issuer: http://localhost:3004/people
      alias: people
      mode: impersonation
  environments:
    - name: sts-operator-dev
      clientAuthIssuers: [cluster-local, people]
      registrator:
        issuerRef: cluster-local
        subject: system:serviceaccount:sts-operator-dev:sts-operator
        registratorJwksUri: http://localhost:8182/jwks
        signingAlg: ES256
