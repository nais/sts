bindAddress: :8080
internalBindAddress: :8081
databaseUrl: postgres://postgres:postgres@localhost:5432/sts?sslmode=disable
additionalCAFile: ../sts-operator/.local/ca.crt
logLevel: info
logFormat: text

authorizationServer:
  issuer: http://localhost:8080
  expectedAudience: nais
  subjectTokenIssuers: {}
  environments:
    - name: sts-operator-dev
      clientAuthIssuer: https://127.0.0.1:6553
      registrator:
        subject: system:serviceaccount:sts-operator-dev:sts-operator
        registratorJwksUri: http://localhost:8182/jwks
        signingAlg: ES256
