{{- if and .Values.fqdnNetworkPolicy.enabled (.Capabilities.APIVersions.Has "networking.gke.io/v1alpha3") }}
{{- $url := required "config.stsBaseUrl is required" .Values.config.stsBaseUrl }}
apiVersion: networking.gke.io/v1alpha3
kind: FQDNNetworkPolicy
metadata:
  name: {{ include "sts-operator.fullname" . }}-fqdn
  labels:
    {{- include "sts-operator.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "sts-operator.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Egress
  egress:
    - to:
        - fqdns:
            - {{ (urlParse $url).hostname | quote }}
      ports:
        - protocol: TCP
          port: 443
{{- end }}
