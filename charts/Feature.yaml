environmentKinds:
  - management

values:
  tenantName:
    displayName: Tenant name
    computed:
      template: "{{.Tenant.Name}}"
  ingress.host:
    displayName: STS host
    computed:
      template: "{{ subdomain . "sts" }}"
  config.authorizationServer.issuer:
    displayName: STS issuer
    computed:
      template: 'https://{{ subdomain . "sts" }}'
  config.authorizationServer.clientAuthIssuers:
    displayName: Client Auth Issuers
    computed:
      template: '[{{ .Env.apiserver_oidc_issuer }}]'
  config.authorizationServer.subjectTokenIssuers:
    displayName: Subject Token Issuers
    computed:
      template: '{ {{ .Env.apiserver_oidc_issuer }}: gke }'
  config.databaseUrl:
    displayName: Database URL
    required: true
    config:
      type: string
      secret: true
  image.tag:
    displayName: Image version
    config:
      type: string
