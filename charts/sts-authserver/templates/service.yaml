apiVersion: v1
kind: Service
metadata:
  name: {{ include "sts.fullname" . }}
  labels:
    {{- include "sts.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "sts.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
