{{- $config := deepCopy .Values.config -}}
{{- $_ := set $config.authorizationServer "externalIssuers" (include "sts.externalIssuers" . | mustFromJson) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sts.fullname" . }}-config
  labels:
    {{- include "sts.labels" . | nindent 4 }}
type: Opaque
stringData:
  config.yaml: |
    {{- toYaml $config | nindent 4 }}
