{{- $config := deepCopy .Values.config -}}
{{- $environments := list -}}
{{- range $obj := .Values.registrators -}}
{{- $environments = append $environments (dict
  "name" $obj.env
  "clientAuthIssuer" $obj.clientAuthIssuer
  "registrator" (dict
    "subject" $obj.subject
    "registratorJwksUri" $obj.registratorJwksUri
    "signingAlg" "RS256"
  )
) -}}
{{- end -}}
{{- $_ := set $config.authorizationServer "environments" $environments -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sts.fullname" . }}-config
  labels:
    {{- include "sts.labels" . | nindent 4 }}
type: Opaque
stringData:
  config.yaml: |
    {{- toYaml $config | nindent 4 }}
