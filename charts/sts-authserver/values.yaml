tenantName: example

config:
  bindAddress: :8080
  internalBindAddress: :8081
  databaseUrl: ""
  logLevel: info
  logFormat: json
  authorizationServer:
    issuer: https://sts.environment.tenant.cloud.nais.io
    # Set an alias-to-URL map in Helm or a JSON object string in Fasit.
    # Leave unset to trust no external issuers.
    externalIssuers: null
    tokenExpiry: "1h"
    clientAuthIssuers:
      cluster-env1:
        issuer: https://kubernetes.default.svc
        alias: kubernetes
        mode: workload
        # Client assertions and registration bearer tokens use this as their sole audience.
        expectedAudience: nais
        maxTokenLifetime: "10m"
        # Defaults; override for non-Kubernetes token claims.
        claimMappings:
          client:
            namespace: kubernetes.io.namespace
            name: kubernetes.io.serviceaccount.name
    environments:
      - name: env1
        clientAuthIssuers: [cluster-env1]
        registrator:
          issuerRef: cluster-env1
          subject: system:serviceaccount:nais-system:sts-operator
          registratorJwksUri: https://sts-operator.environment.tenant.cloud.nais.io/jwks
          signingAlg: ES256

image:
  repository: europe-north1-docker.pkg.dev/nais-io/nais/images/sts
  pullPolicy: IfNotPresent
  tag: main

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: "sts-sa"

podAnnotations: {}

# Delay SIGTERM to allow endpoint removal to propagate.
preStopSleepSeconds: 5

podSecurityContext:
  fsGroup: 65532
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

securityContext:
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532

resources:
  limits:
    memory: 256Mi
  requests:
    cpu: 10m
    memory: 32Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 75

ingress:
  enabled: true
  className: internal-haproxy
  host: sts.environment.tenant.cloud.nais.io

nodeSelector: {}
tolerations: []

# Allow HTTPS egress to registrator JWKS and external issuer hosts if the GKE API is available.
fqdnNetworkPolicy:
  enabled: true

postgresqlEnabled: true
postgresql:
  # Shared Cluster/Secret naming contract. Keep stable after the first install.
  # Use a distinct name for each release in the same namespace (max 50 characters).
  fullnameOverride: sts-db
  networkPolicy:
    enabled: true
    apiServerCidrs: []
    dnsCidrs: []
  keep: false
  instances: 2
  database:
    name: sts
    owner: sts
  storage:
    size: 1Gi
    storageClass: ""
