tenantName: example

config:
  bindAddress: :8080
  internalBindAddress: :8081
  databaseUrl: ""
  encryptionKeyFile: /etc/sts-encryption/encryption.key
  logLevel: info
  logFormat: json
  authorizationServer:
    issuer: https://sts.environment.tenant.cloud.nais.io
    # Client assertions and registration bearer tokens use this as their sole audience.
    expectedAudience: nais
    clientAuthIssuers: []
    subjectTokenIssuers: {}
    tokenExpiry: "1h"
  registrators: []

image:
  repository: europe-north1-docker.pkg.dev/nais-io/nais/images/sts
  pullPolicy: IfNotPresent
  tag: main

imagePullSecrets: []
encryptionKeySecretName: sts-encryption-key
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: "sts-sa"

podAnnotations: {}

podSecurityContext:
  fsGroup: 65532
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

securityContext:
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532

resources:
  limits:
    memory: 256Mi
  requests:
    cpu: 10m
    memory: 32Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 75

ingress:
  enabled: true
  className: internal-haproxy
  host: sts.environment.tenant.cloud.nais.io

nodeSelector: {}
tolerations: []
