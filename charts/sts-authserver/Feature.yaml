values:
  tenantName:
    displayName: Tenant name
    computed:
      template: "{{.Tenant.Name}}"
  ingress.host:
    displayName: STS host
    computed:
      template: '{{ subdomain . "sts" }}'
  config.authorizationServer.issuer:
    displayName: STS issuer
    computed:
      template: 'https://{{ subdomain . "sts" }}'
  # TODO: make configurable
  config.authorizationServer.subjectTokenIssuers:
    displayName: Subject Token Issuers
    computed:
      template: '{ {{ .Env.apiserver_oidc_issuer }}: {{ .Env.name }} }'
  image.tag:
    displayName: Image version
    config:
      type: string
  postgresql.networkPolicy.apiServerCidrs:
    displayName: API server CIDRs
    computed:
      template: '["{{ .Env.apiserver_endpoint }}/32"]'
  postgresql.networkPolicy.dnsCidrs:
    displayName: DNS CIDRs
    computed:
      template: '["{{ .Env.svc_ip_cidr_range }}"]'
  registrators:
    displayName: Registrators
    computed:
      template: |
        {{ range $obj := .Envs  }}
        {{ if and (hasPrefix $.Env.name $obj.name) (not (empty $obj.apiserver_oidc_issuer)) }}
        - env: {{ $obj.name }}
          subject: system:serviceaccount:nais-system:sts-operator
          clientAuthIssuer: {{ $obj.apiserver_oidc_issuer }}
          registratorJwksUri: https://sts-operator.{{ $obj.name }}.{{ $.Tenant.Name}}.cloud.nais.io/jwks
        {{ end }}
        {{ end }}
