values:
  tenantName:
    displayName: Tenant name
    computed:
      template: "{{.Tenant.Name}}"
  ingress.host:
    displayName: STS host
    computed:
      template: '{{ subdomain . "sts" }}'
  image.tag:
    displayName: Image version
    config:
      type: string
  postgresql.networkPolicy.apiServerCidrs:
    displayName: API server CIDRs
    computed:
      template: '["{{ .Env.apiserver_endpoint }}/32"]'
  postgresql.networkPolicy.dnsCidrs:
    displayName: DNS CIDRs
    computed:
      template: '["{{ .Env.svc_ip_cidr_range }}"]'
  config.authorizationServer.issuer:
    displayName: STS issuer
    computed:
      template: 'https://{{ subdomain . "sts" }}'
  config.authorizationServer.externalIssuers:
    displayName: External subject-token issuers
    description: 'JSON object mapping aliases to issuer URLs, e.g. {"identity":"https://identity.example.com"}.'
    config:
      type: string
  config.authorizationServer.clientAuthIssuers:
    displayName: Client authentication issuers
    computed:
      template: |
        {{ range $obj := .Envs }}
        {{ if and (hasPrefix $.Env.name $obj.name) (not (empty $obj.apiserver_oidc_issuer)) }}
        {{ $obj.name | quote }}:
          issuer: {{ $obj.apiserver_oidc_issuer | quote }}
          alias: kubernetes
          mode: workload
          expectedAudience: nais
          maxTokenLifetime: 10m
          clientClaims:
            namespace: kubernetes.io.namespace
            name: kubernetes.io.serviceaccount.name
        {{ end }}
        {{ end }}
  config.authorizationServer.environments:
    displayName: Trust domains
    computed:
      template: |
        {{ range $obj := .Envs }}
        {{ if and (hasPrefix $.Env.name $obj.name) (not (empty $obj.apiserver_oidc_issuer)) }}
        - name: {{ $obj.name | quote }}
          clientAuthIssuers: [{{ $obj.name | quote }}]
          registrator:
            issuerRef: {{ $obj.name | quote }}
            subject: system:serviceaccount:nais-system:sts-operator
            registratorJwksUri: https://sts-operator.{{ $obj.name }}.{{ $.Tenant.Name }}.cloud.nais.io/jwks
            signingAlg: ES256
        {{ end }}
        {{ end }}
