nameOverride: ""
fullnameOverride: ""

# Retain the Cluster on Helm uninstall. Does not protect against namespace deletion,
# direct kubectl deletion, or storage failures. See README before reinstalling.
keep: true

# Total instances, including the primary (not the number of replicas).
instances: 3
# Pin a tested patch tag or digest before production. Major upgrades need a plan;
# do not change this to a new major version as an ordinary Helm upgrade.
imageName: ghcr.io/cloudnative-pg/postgresql:18

database:
  # Applied only when bootstrapping a NEW cluster, not on subsequent upgrades.
  name: app
  owner: app

storage:
  # Per instance. Expansion depends on the storage class; shrinking is unsupported.
  size: 10Gi
  # Empty uses the cluster's default StorageClass.
  storageClass: ""

# Starting values only; size for your workload. No CPU limit by default.
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 512Mi

# Require a different node for each instance. Three instances need three eligible
# nodes. This does not guarantee distribution across availability zones.
affinity:
  enablePodAntiAffinity: true
  podAntiAffinityType: required
  topologyKey: kubernetes.io/hostname

# Passed to spec.postgresql.parameters. Values must be strings.
postgresql:
  parameters: {}

# Optional metadata for the Cluster resource (not the generated pods).
annotations: {}

# Optional database-pod isolation, including initdb jobs selected by cnpg.io/cluster.
# Same-cluster traffic and same-release application ingress are allowed when enabled.
# DNS pod egress is included; set cluster-specific API/DNS CIDRs below.
networkPolicy:
  enabled: false
  operator:
    # Matches app.kubernetes.io/name, not a Deployment/resource name.
    name: cloudnative-pg
    namespace: nais-system
  # API endpoints on TCP 443 (may differ from the Kubernetes Service IP).
  apiServerCidrs: []
  # DNS service/node-local addresses on UDP/TCP 53, in addition to DNS pods.
  dnsCidrs: []
  # Additional rules use standard Kubernetes NetworkPolicy syntax.
  ingress: []
  egress: []
