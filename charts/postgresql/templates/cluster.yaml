apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ include "postgresql.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "postgresql.labels" . | nindent 4 }}
  {{- if or .Values.keep .Values.annotations }}
  annotations:
    {{- with .Values.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- if .Values.keep }}
    helm.sh/resource-policy: keep
    {{- end }}
  {{- end }}
spec:
  instances: {{ .Values.instances }}
  imageName: {{ .Values.imageName | quote }}
  enableSuperuserAccess: false
  bootstrap:
    initdb:
      database: {{ .Values.database.name | quote }}
      owner: {{ .Values.database.owner | quote }}
  storage:
    size: {{ .Values.storage.size | quote }}
    {{- with .Values.storage.storageClass }}
    storageClass: {{ . | quote }}
    {{- end }}
  resources:
    {{- toYaml .Values.resources | nindent 4 }}
  affinity:
    {{- toYaml .Values.affinity | nindent 4 }}
  {{- with .Values.postgresql.parameters }}
  postgresql:
    parameters:
      {{- toYaml . | nindent 6 }}
  {{- end }}
