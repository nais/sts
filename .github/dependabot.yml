version: 2
updates:
  - package-ecosystem: gomod
    directories:
      - /sts-authserver
      - /sts-authserver/api
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/Oslo
    cooldown:
      default-days: 7
    groups:
      go:
        patterns:
          - '*'
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/Oslo
    groups:
      gh-actions:
        patterns:
          - "*"
    cooldown:
      default-days: 7
  - package-ecosystem: docker
    directory: /sts-authserver
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/Oslo
    groups:
      docker:
        patterns:
          - "*"
    cooldown:
      default-days: 7
