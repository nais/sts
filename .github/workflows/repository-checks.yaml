name: Repository checks

on:
  push:
    paths:
      - ".github/**"
      - "mise.toml"
      - ".mise-tasks/**"

permissions:
  contents: read

jobs:
  ratchet:
    name: Pinned GitHub Actions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # ratchet:jdx/mise-action@v5.1.1
      - run: mise run check:ratchet
