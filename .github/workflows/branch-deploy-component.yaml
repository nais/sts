name: branch-deploy-component

on:
  workflow_call:
    inputs:
      component:
        description: authserver or operator
        type: string
        required: true
    secrets:
      NAIS_IO_WORKLOAD_IDENTITY_PROVIDER:
        required: true

permissions:
  contents: read

# Shared with the main pipelines; replaces older pending runs.
concurrency:
  group: sts-${{ inputs.component }}-chart
  cancel-in-progress: false

env:
  # Image and chart name: sts (authserver) or sts-operator.
  NAME: ${{ inputs.component == 'operator' && 'sts-operator' || 'sts' }}

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: sts-deploy-dev
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      version: ${{ steps.chart.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # ratchet:jdx/mise-action@v5
        with:
          install_args: helm yq
      - uses: nais/platform-build-push-sign@0f74f19fb291a0563f7d30e23fb83de3c4c7c851 # ratchet:nais/platform-build-push-sign@main
        id: image
        with:
          name: ${{ env.NAME }}
          dockerfile: sts-${{ inputs.component }}/Dockerfile
          # The operator needs the root context for the local API module.
          context: ${{ inputs.component == 'operator' && '.' || 'sts-authserver' }}
          cache_from: type=gha,scope=sts-${{ inputs.component }}-branch
          cache_to: type=gha,mode=max,scope=sts-${{ inputs.component }}-branch
          google_service_account: gh-sts
          workload_identity_provider: ${{ secrets.NAIS_IO_WORKLOAD_IDENTITY_PROVIDER }}
          push_ghcr: true
          push: true
      - name: Package chart
        id: chart
        env:
          CHART: charts/sts-${{ inputs.component }}
          IMAGE_VERSION: ${{ steps.image.outputs.version }}
        run: mise run --skip-tools ci:package-branch-chart "$CHART" "$IMAGE_VERSION"
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # ratchet:google-github-actions/auth@v3
        id: auth
        with:
          workload_identity_provider: ${{ secrets.NAIS_IO_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: gh-sts@nais-io.iam.gserviceaccount.com
          token_format: access_token
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # ratchet:docker/login-action@v4
        with:
          registry: europe-north1-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}
      - name: Push chart
        env:
          VERSION: ${{ steps.chart.outputs.version }}
        run: helm push "$NAME-$VERSION.tgz" oci://europe-north1-docker.pkg.dev/nais-io/nais/feature

  deploy:
    needs: publish
    runs-on: fasit-deploy
    environment: sts-deploy-dev
    permissions:
      id-token: write
    steps:
      - uses: nais/fasit-deploy@53e433b1bdd08fc622e03a78584c0832c9083bd3 # ratchet:nais/fasit-deploy@v4.1.1
        with:
          chart: oci://europe-north1-docker.pkg.dev/nais-io/nais/feature/${{ env.NAME }}
          version: ${{ needs.publish.outputs.version }}
          targets: |
            [
              { "target": { "kind": "tenant", "tenant": "dev-nais" }, "wait": true }
            ]
