name: authserver

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: sts-authserver-chart
  cancel-in-progress: false

jobs:
  changes:
    uses: ./.github/workflows/changes.yaml
    with:
      code-paths: |
        [
          "sts-authserver", ":!sts-authserver/*.md",
          "mise.toml", ".mise-tasks",
          ".github/workflows/authserver.yaml",
          ".github/workflows/image.yaml",
          ".github/workflows/changes.yaml",
          ".github/workflows/pr.yaml",
          ".github/workflows/mise.yaml"
        ]
      chart-paths: |
        [
          "charts/sts-authserver",
          ".github/workflows/release-chart.yaml",
          ".github/workflows/deploy.yaml"
        ]

  checks:
    uses: ./.github/workflows/mise.yaml
    with:
      tasks: |
        [
          "check:ratchet",
          "check:release-scripts",
          "check:helm-lint",
          "sts-authserver:check:helm-render",
          "ci:fmt sts-authserver:fmt",
          "ci:generate sts-authserver:generate"
        ]

  image:
    needs: [changes, checks]
    if: needs.changes.outputs.code == 'true'
    permissions:
      contents: write
      packages: write
      id-token: write
    uses: ./.github/workflows/image.yaml
    with:
      name: sts
      context: sts-authserver
      dockerfile: sts-authserver/Dockerfile
      cache-scope: sts-authserver
      tasks: '["sts-authserver:check", "sts-authserver:test"]'
    secrets:
      NAIS_IO_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.NAIS_IO_WORKLOAD_IDENTITY_PROVIDER }}

  chart:
    needs: [changes, checks, image]
    if: >-
      !cancelled() &&
      needs.checks.result == 'success' &&
      (
        (needs.changes.outputs.code == 'true' && needs.image.result == 'success') ||
        (needs.changes.outputs.chart == 'true' && needs.changes.outputs.code != 'true')
      )
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/release-chart.yaml
    with:
      name: sts
      chart: charts/sts-authserver
    secrets:
      NAIS_IO_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.NAIS_IO_WORKLOAD_IDENTITY_PROVIDER }}

  deploy:
    needs: chart
    if: >-
      !cancelled() &&
      needs.chart.result == 'success' &&
      github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy.yaml
    with:
      name: sts
      version: ${{ needs.chart.outputs.version }}
      targets: |
        [
          { "target": { "kind": "tenant", "tenant": "ci-nais" }, "wait": true },
          { "target": { "kind": "tenant", "tenant": "dev-nais" } },
          { "target": { "kind": "tenant", "tenant": "test-nais" } }
        ]
