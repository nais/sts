name: authserver

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      chart: ${{ steps.filter.outputs.chart }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: filter
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          # A missing base, e.g. after a force push, compares against an empty tree.
          if ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            BEFORE=$(git hash-object -t tree /dev/null)
          fi
          changed() { ! git diff --quiet "$BEFORE" "$GITHUB_SHA" -- "$@"; }

          if changed sts-authserver ':!sts-authserver/*.md' mise.toml .mise-tasks \
            .github/workflows/authserver.yaml .github/workflows/authserver-image.yaml .github/workflows/checks.yaml; then
            echo code=true >> "$GITHUB_OUTPUT"
          fi
          if changed charts/sts-authserver .github/workflows/authserver-chart.yaml; then
            echo chart=true >> "$GITHUB_OUTPUT"
          fi

  image:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    permissions:
      contents: write
      packages: write
      id-token: write
    uses: ./.github/workflows/authserver-image.yaml
    secrets:
      NAIS_IO_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.NAIS_IO_WORKLOAD_IDENTITY_PROVIDER }}

  chart:
    needs: changes
    # Skip when code also changed; the image workflow deploys the chart after its release.
    if: needs.changes.outputs.chart == 'true' && needs.changes.outputs.code != 'true'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/authserver-chart.yaml
    secrets:
      NAIS_IO_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.NAIS_IO_WORKLOAD_IDENTITY_PROVIDER }}
