name: authserver

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: sts-authserver-chart
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.changes.outputs.code }}
      chart: ${{ steps.changes.outputs.chart }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # ratchet:jdx/mise-action@v5
        with:
          install: false
      - id: changes
        name: Classify changes
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          mise run --skip-tools ci:classify-changes \
            --code sts-authserver \
            --code ':!sts-authserver/*.md' \
            --code mise.toml \
            --code .mise-tasks \
            --code .github/workflows/authserver.yaml \
            --code .github/workflows/authserver-image.yaml \
            --code .github/workflows/pr.yaml \
            --code .github/workflows/mise.yaml \
            --chart charts/sts-authserver \
            --chart .github/workflows/authserver-chart.yaml

  checks:
    uses: ./.github/workflows/mise.yaml
    with:
      tasks: |
        [
          "check:ratchet",
          "check:helm-lint"
        ]

  image:
    needs: [changes, checks]
    if: needs.changes.outputs.code == 'true'
    permissions:
      contents: write
      packages: write
      id-token: write
    uses: ./.github/workflows/authserver-image.yaml
    secrets:
      NAIS_IO_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.NAIS_IO_WORKLOAD_IDENTITY_PROVIDER }}

  chart:
    needs: [changes, checks, image]
    if: >-
      !cancelled() &&
      needs.checks.result == 'success' &&
      (
        (needs.changes.outputs.code == 'true' && needs.image.result == 'success') ||
        (needs.changes.outputs.chart == 'true' && needs.changes.outputs.code != 'true')
      )
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/authserver-chart.yaml
    secrets:
      NAIS_IO_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.NAIS_IO_WORKLOAD_IDENTITY_PROVIDER }}

  deploy:
    needs: chart
    if: github.ref == 'refs/heads/main'
    runs-on: fasit-deploy
    permissions:
      id-token: write
    steps:
      - uses: nais/fasit-deploy@53e433b1bdd08fc622e03a78584c0832c9083bd3 # ratchet:nais/fasit-deploy@v4.1.1
        with:
          chart: oci://europe-north1-docker.pkg.dev/nais-io/nais/feature/sts
          version: ${{ needs.chart.outputs.version }}
          targets: |
            [
              { "target": { "kind": "tenant", "tenant": "dev-nais" } }
            ]
