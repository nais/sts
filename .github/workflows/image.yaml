name: image

on:
  workflow_call:
    inputs:
      name:
        type: string
        required: true
      context:
        type: string
        required: true
      dockerfile:
        type: string
        required: true
      cache-scope:
        type: string
        required: true
      tasks:
        description: JSON array of checks required before creating the image release
        type: string
        required: true
      release-prefix:
        description: Component-specific release tag prefix; empty preserves authserver tags
        type: string
        default: ""
      google-service-account:
        type: string
        default: gh-sts
    secrets:
      NAIS_IO_WORKLOAD_IDENTITY_PROVIDER:
        required: true

permissions:
  contents: read

concurrency:
  group: ${{ inputs.cache-scope }}-image
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/mise.yaml
    with:
      go-cache: true
      tasks: ${{ inputs.tasks }}

  build:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
      id-token: write
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.build-push-sign.outputs.version }}
      image: ${{ steps.build-push-sign.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # ratchet:jdx/mise-action@v5
        with:
          install: false
          cache: false
      - name: Read Go version
        id: go_version
        run: echo "go_version=$(mise current go)" >> "$GITHUB_OUTPUT"
      - uses: nais/platform-build-push-sign@0f74f19fb291a0563f7d30e23fb83de3c4c7c851 # ratchet:nais/platform-build-push-sign@main
        id: build-push-sign
        with:
          name: ${{ inputs.name }}
          dockerfile: ${{ inputs.dockerfile }}
          context: ${{ inputs.context }}
          cache_from: type=gha,scope=${{ inputs.cache-scope }}
          cache_to: type=gha,mode=max,scope=${{ inputs.cache-scope }}
          build_args: |
            GO_VERSION=${{ steps.go_version.outputs.go_version }}
          google_service_account: ${{ inputs.google-service-account }}
          workload_identity_provider: ${{ secrets.NAIS_IO_WORKLOAD_IDENTITY_PROVIDER }}
          push_ghcr: true
          push: true

  release:
    needs: [checks, build]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # ratchet:jdx/mise-action@v5
        with:
          install: false
          cache: false
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          IMAGE_VERSION: ${{ needs.build.outputs.version }}
          IMAGE: ${{ needs.build.outputs.image }}
          RELEASE_PREFIX: ${{ inputs.release-prefix }}
        run: mise run --skip-tools ci:release "$IMAGE_VERSION" "$IMAGE" "$RELEASE_PREFIX"
