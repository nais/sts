name: mise

on:
  workflow_call:
    inputs:
      tasks:
        type: string
        required: true
      go-cache:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  run:
    name: ${{ matrix.task }}
    strategy:
      fail-fast: false
      matrix:
        task: ${{ fromJSON(inputs.tasks) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # ratchet:actions/cache@v6.1.0
        if: inputs.go-cache
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          # Separate task caches and refresh compilation results per commit.
          key: ${{ runner.os }}-${{ runner.arch }}-go-${{ matrix.task }}-${{ hashFiles('mise.toml', '**/mise.toml') }}-${{ hashFiles('**/go.sum') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-go-${{ matrix.task }}-${{ hashFiles('mise.toml', '**/mise.toml') }}-${{ hashFiles('**/go.sum') }}-
            ${{ runner.os }}-${{ runner.arch }}-go-${{ matrix.task }}-${{ hashFiles('mise.toml', '**/mise.toml') }}-
            ${{ runner.os }}-${{ runner.arch }}-go-${{ matrix.task }}-
      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # ratchet:jdx/mise-action@v5
        with:
          install_args: --monorepo
      - run: mise run ${{ matrix.task }}
