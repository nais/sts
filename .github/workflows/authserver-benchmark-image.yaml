name: authserver-benchmark-image

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # ratchet:jdx/mise-action@v5
      - name: Read Go version
        id: go_version
        run: echo "go_version=$(mise current go)" >> "$GITHUB_OUTPUT"
      - uses: nais/platform-build-push-sign@0f74f19fb291a0563f7d30e23fb83de3c4c7c851 # ratchet:nais/platform-build-push-sign@main
        id: build-push-sign
        with:
          name: sts-benchmark
          dockerfile: hack/benchmark.Dockerfile
          context: sts-authserver
          cache_from: type=gha,scope=sts-authserver-benchmark
          cache_to: type=gha,mode=max,scope=sts-authserver-benchmark
          build_args: |
            GO_VERSION=${{ steps.go_version.outputs.go_version }}
          google_service_account: gh-sts
          workload_identity_provider: ${{ secrets.NAIS_IO_WORKLOAD_IDENTITY_PROVIDER }}
          push: true
      - name: Write benchmark command
        env:
          IMAGE: ${{ steps.build-push-sign.outputs.image }}
        run: |
          printf '### Run the cluster benchmark\n\n~~~shell\nmise -C sts-authserver run test:benchmark-cluster --image %s\n~~~\n' "$IMAGE" >> "$GITHUB_STEP_SUMMARY"
