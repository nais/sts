name: pr

on:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/mise.yaml
    with:
      tasks: |
        [
          "check:ratchet",
          "check:helm-lint"
        ]

  authserver:
    name: checks # Preserve required status-check names.
    uses: ./.github/workflows/mise.yaml
    with:
      go-cache: true
      tasks: |
        [
          "sts-authserver:check",
          "sts-authserver:test"
        ]
