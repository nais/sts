name: authserver-chart

on:
  workflow_call:
    outputs:
      version:
        description: Published chart version
        value: ${{ jobs.publish.outputs.version }}
    secrets:
      NAIS_IO_WORKLOAD_IDENTITY_PROVIDER:
        required: true

permissions:
  contents: read

env:
  NAME: sts
  FEATURE_REPOSITORY: oci://europe-north1-docker.pkg.dev/nais-io/nais/feature

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      version: ${{ steps.push.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
        with:
          # Delayed image builds calling this workflow must not restore older chart files.
          ref: main
          persist-credentials: false
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # ratchet:jdx/mise-action@v5
        with:
          install_args: helm yq
      - name: Package chart
        id: chart
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: mise run --skip-tools ci:package-chart charts/sts-authserver
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # ratchet:google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.NAIS_IO_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: gh-${{ env.NAME }}@nais-io.iam.gserviceaccount.com
          token_format: access_token
      - name: Log in to registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # ratchet:docker/login-action@v4
        with:
          registry: europe-north1-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}
      - name: Push chart
        id: push
        env:
          CHART_VERSION: ${{ steps.chart.outputs.version }}
        run: |
          helm push "$NAME-$CHART_VERSION.tgz" "$FEATURE_REPOSITORY"
          echo "version=$CHART_VERSION" >> "$GITHUB_OUTPUT"
