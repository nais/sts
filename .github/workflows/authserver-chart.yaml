name: authserver-chart

on:
  workflow_call:
    inputs:
      publish:
        type: boolean
        default: false
    secrets:
      NAIS_IO_WORKLOAD_IDENTITY_PROVIDER:
        required: true

permissions:
  contents: read

concurrency:
  group: sts-authserver-chart-${{ github.ref }}-${{ inputs.publish }}
  cancel-in-progress: false

env:
  NAME: sts
  FEATURE_REPOSITORY: oci://europe-north1-docker.pkg.dev/nais-io/nais/feature

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # ratchet:jdx/mise-action@v5
        with:
          install_args: helm
      - run: mise run check:helm-lint

  publish:
    needs: lint
    if: inputs.publish && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      version: ${{ steps.push.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # ratchet:jdx/mise-action@v5
        with:
          install_args: helm yq
      - name: Package chart
        id: chart
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Resolve under the chart lock so delayed runs cannot restore older images.
          IMAGE_TAG=$(gh release view --json tagName --jq .tagName)
          version="$(date -u +%Y-%m-%d-%H%M%S)-$(git rev-parse --short=7 HEAD)"
          export IMAGE_TAG CHART_VERSION="$version"

          yq -i '.image.tag = strenv(IMAGE_TAG)' charts/sts-authserver/values.yaml
          yq -i '.version = strenv(CHART_VERSION) | .appVersion = strenv(IMAGE_TAG)' charts/sts-authserver/Chart.yaml

          # Timestamp versions package successfully but fail strict SemVer lint.
          helm lint charts/sts-authserver
          helm package charts/sts-authserver

          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # ratchet:google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.NAIS_IO_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: gh-${{ env.NAME }}@nais-io.iam.gserviceaccount.com
          token_format: access_token
      - name: Log in to registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # ratchet:docker/login-action@v4
        with:
          registry: europe-north1-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}
      - name: Push chart
        id: push
        env:
          CHART_VERSION: ${{ steps.chart.outputs.version }}
        run: |
          helm push "$NAME-$CHART_VERSION.tgz" "$FEATURE_REPOSITORY"
          echo "version=$CHART_VERSION" >> "$GITHUB_OUTPUT"

  deploy:
    needs: publish
    if: inputs.publish && github.ref == 'refs/heads/main' && needs.publish.outputs.version != ''
    runs-on: fasit-deploy
    permissions:
      id-token: write
    steps:
      - uses: nais/fasit-deploy@53e433b1bdd08fc622e03a78584c0832c9083bd3 # ratchet:nais/fasit-deploy@v4.1.1
        with:
          chart: ${{ env.FEATURE_REPOSITORY }}/${{ env.NAME }}
          version: ${{ needs.publish.outputs.version }}
          targets: |
            [
              { "target": { "kind": "tenant", "tenant": "dev-nais" } }
            ]
