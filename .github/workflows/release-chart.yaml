name: release-chart

on:
  workflow_call:
    inputs:
      name:
        type: string
        required: true
      chart:
        type: string
        required: true
      release-prefix:
        type: string
        default: ""
      google-service-account:
        type: string
        default: gh-sts
    outputs:
      version:
        description: Published chart version
        value: ${{ jobs.publish.outputs.version }}
    secrets:
      NAIS_IO_WORKLOAD_IDENTITY_PROVIDER:
        required: true

permissions:
  contents: read

env:
  FEATURE_REPOSITORY: oci://europe-north1-docker.pkg.dev/nais-io/nais/feature

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      version: ${{ steps.push.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
        with:
          # Delayed image builds calling this workflow must not restore older chart files.
          ref: main
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # ratchet:jdx/mise-action@v5
        with:
          install_args: helm yq
      - name: Package chart
        id: chart
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CHART: ${{ inputs.chart }}
          RELEASE_PREFIX: ${{ inputs.release-prefix }}
        run: mise run --skip-tools ci:package-chart "$CHART" "$RELEASE_PREFIX"
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # ratchet:google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.NAIS_IO_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ inputs.google-service-account }}@nais-io.iam.gserviceaccount.com
          token_format: access_token
      - name: Log in to registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # ratchet:docker/login-action@v4
        with:
          registry: europe-north1-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}
      - name: Push chart
        id: push
        env:
          CHART_VERSION: ${{ steps.chart.outputs.version }}
          NAME: ${{ inputs.name }}
        run: |
          helm push "$NAME-$CHART_VERSION.tgz" "$FEATURE_REPOSITORY"
          echo "version=$CHART_VERSION" >> "$GITHUB_OUTPUT"
