[settings]
pin = true

[tools]
go = "1.27.1"
helm = "4.2.4"
yq = "4.53.6"
jq = "1.8.2"
step = "0.30.6"
golangci-lint = "2.13.1"
"go:github.com/securego/gosec/v2/cmd/gosec" = "2.29.0"
"go:github.com/sethvargo/ratchet" = "0.12.0"
"go:golang.org/x/tools/cmd/deadcode" = "0.49.0"
"go:golang.org/x/vuln/cmd/govulncheck" = "1.7.0"
"go:honnef.co/go/tools/cmd/staticcheck" = "0.8.1"
"go:mvdan.cc/gofumpt" = "0.11.0"
"go:github.com/sqlc-dev/sqlc/cmd/sqlc" = "1.31.1"

[tasks.check]
description = "Run all static checks"
depends = [
  "check:golangci-lint",
  "check:deadcode",
  "check:gosec",
  "check:govet",
  "check:ratchet",
  "check:staticcheck",
  "check:govulncheck",
  "check:helm-lint",
  "check:sqlc",
]

[tasks."check:golangci-lint"]
description = "Run golangci-lint"
run = "golangci-lint run"

[tasks."check:deadcode"]
description = "Run deadcode"
run = "deadcode -test ./..."

[tasks."check:gosec"]
description = "Run gosec"
run = "gosec --exclude-generated -terse ./..."

[tasks."check:govet"]
description = "Run go vet"
run = "go vet ./..."

[tasks."check:ratchet"]
description = "Verify all github actions are pinned"
run = "ratchet lint .github/workflows/*.yaml"

[tasks."check:staticcheck"]
description = "Run staticcheck"
run = "staticcheck ./..."

[tasks."check:govulncheck"]
description = "Run govulncheck"
run = "govulncheck ./..."

[tasks."check:helm-lint"]
description = "Lint helm chart"
run = "helm lint --strict ./charts"

[tasks."check:sqlc"]
description = "Check SQL queries and schema"
run = "sqlc vet"

[tasks.fmt]
description = "Format all code"
depends = ["fmt:go"]

[tasks."fmt:go"]
description = "Format go files using gofumpt"
run = "gofumpt -w ./"

[tasks.test]
description = "Run tests"
run = "go test -cover ./..."

[tasks."test:integration"]
description = "Run PostgreSQL integration tests"
run = "go test -tags=integration_test ./..."

[tasks.generate]
description = "Generate source files"
depends = ["generate:sqlc"]

[tasks."generate:sqlc"]
description = "Generate SQL functions and models"
run = "sqlc generate"

[tasks.setup]
description = "Setup local environment"
run = '''
test -e .env || cp .env.example .env
set -euo pipefail
docker compose up -d
go run cmd/setup_local_env/main.go
'''

[tasks.local]
description = "Run the service locally"
depends = ["setup"]
run = "go run ./cmd/sts"
env = { _.file = ".env" }

[tasks."token:m2m"]
description = "Get a client credentials token"
env = { _.file = ".env" }
run = '''
: "${CLIENT_ID:?set CLIENT_ID}"
: "${TOKEN_AUDIENCE:?set TOKEN_AUDIENCE}"

WORKLOAD_TOKEN=$(curl -s --fail-with-body \
  "http://localhost:3004/env1/token" \
  -d 'grant_type=client_credentials' \
  -d "client_secret=yolo" \
  -d "client_id=${CLIENT_ID}" | jq -r '.access_token')
curl -s --fail-with-body \
   "${ISSUER}/token" \
  -d 'grant_type=client_credentials' \
  -d "client_id=${CLIENT_ID}" \
  -d 'client_assertion_type=urn:ietf:params:oauth:client-assertion-type:jwt-bearer' \
  -d "client_assertion=${WORKLOAD_TOKEN}" \
  -d "scope=${TOKEN_AUDIENCE}" | jq -r '.access_token' | step crypto jwt inspect --insecure | jq -r .
'''

[tasks."token:obo"]
description = "Exchange a subject token"
env = { _.file = ".env" }
run = '''
: "${CLIENT_ID:?set CLIENT_ID}"
: "${TOKEN_AUDIENCE:?set TOKEN_AUDIENCE}"
REDIRECT_URI="http://localhost:3004/debugger/debugger/callback"
AUTHORIZATION_CODE=$(curl -s --fail-with-body --get --output /dev/null --write-out '%{redirect_url}' \
  "http://localhost:3004/subject1/authorize" \
  -d 'client_id=debugger' \
  -d 'scope=openid somescope' \
  -d 'response_type=code' \
  -d 'response_mode=query' \
  -d 'state=1234' \
  -d 'nonce=5678' \
  -d "redirect_uri=${REDIRECT_URI}" | jq -rR 'capture("[?&]code=(?<code>[^&]+)").code')
WORKLOAD_TOKEN=$(curl -s --fail-with-body \
  "http://localhost:3004/env1/token" \
  -d 'grant_type=client_credentials' \
  -d "client_secret=yolo" \
  -d "client_id=${CLIENT_ID}" | jq -r '.access_token')
SUBJECT_TOKEN=$(curl -s --fail-with-body \
  "http://localhost:3004/subject1/token" \
  -d 'grant_type=authorization_code' \
  -d "code=${AUTHORIZATION_CODE}" \
  -d "client_secret=yolo" \
  -d 'client_id=debugger' \
  -d "redirect_uri=${REDIRECT_URI}" | jq -r '.access_token')
curl -s --fail-with-body \
  "${ISSUER}/token" \
  -d 'grant_type=urn:ietf:params:oauth:grant-type:token-exchange' \
  -d "client_id=${CLIENT_ID}" \
  -d 'client_assertion_type=urn:ietf:params:oauth:client-assertion-type:jwt-bearer' \
  -d "client_assertion=${WORKLOAD_TOKEN}" \
  -d "audience=${TOKEN_AUDIENCE}" \
  -d "subject_token=${SUBJECT_TOKEN}" \
  -d 'subject_token_type=urn:ietf:params:oauth:token-type:jwt' \
  -d 'requested_token_type=urn:ietf:params:oauth:token-type:access_token' | jq -r '.access_token' | step crypto jwt inspect --insecure | jq -r .
'''

[tasks."actions:update"]
description = "Upgrade github actions to latest version satisfying their version tag"
run = "ratchet update .github/workflows/*.yaml"

[tasks."actions:upgrade"]
description = "Upgrade github actions to latest"
run = "ratchet upgrade .github/workflows/*.yaml"
