bindAddress: :8080
internalBindAddress: :8081
databaseUrl: postgres://postgres:postgres@localhost:5432/sts?sslmode=disable
logLevel: info
logFormat: text

authorizationServer:
  issuer: http://localhost:8080
  # Client assertions and registration bearer tokens use this as their sole audience.
  expectedAudience: nais
  clientAuthIssuers:
    - http://localhost:3004/env1
    - http://localhost:3004/env2
  subjectTokenIssuers:
    http://localhost:3004/subject1: name1
    http://localhost:3004/subject2: name2
  tokenExpiry: "1h"

registrators:
  - issuer: http://localhost:3004/env1
    subject: client-registrator
    clientJwksUri: http://localhost:3004/env1/jwks
    requiredAlgs:
      - RS256
