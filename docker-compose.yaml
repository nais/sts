services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: sts
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
  adminer:
    depends_on:
      - postgres
    image: adminer:latest
    ports:
      - "3003:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres

volumes:
  postgres-data:
