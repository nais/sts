services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: sts
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
  adminer:
    depends_on:
      postgres:
        condition: service_healthy
    image: adminer:latest
    ports:
      - "3003:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
  mock-oauth-server:
    image: ghcr.io/navikt/mock-oauth2-server:latest
    ports:
      - "3004:8080"
    environment:
      JSON_CONFIG: |
        {
          "interactiveLogin": true,
          "tokenCallbacks": [
            {
              "issuerId": "env1",
              "tokenExpiry": 3600,
              "requestMappings": [
                {
                  "requestParam": "grant_type",
                  "match": "client_credentials",
                  "claims": {
                    "sub": "${clientId}",
                    "aud": ["nais"]
                  }
                }
              ]
            }
          ]
        }


volumes:
  postgres-data:
