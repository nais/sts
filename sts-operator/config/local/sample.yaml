apiVersion: v1
kind: Namespace
metadata:
  name: sts-demo
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: consumer
  namespace: sts-demo
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: smoke-client
  namespace: sts-demo
---
apiVersion: nais.io/v1
kind: OAuthClient
metadata:
  name: smoke-client
  namespace: sts-demo
spec:
  configMapName: sts-smoke-client
  acl:
    - team: sts-demo
      workloads:
        - name: consumer
          roles: [reader]
        - name: impersonation-demo
          roles: [reader]
---
apiVersion: nais.io/v1
kind: OAuthClient
metadata:
  name: consumer
  namespace: sts-demo
spec:
  configMapName: sts-consumer
  acl: []
---
apiVersion: nais.io/v1
kind: OAuthClient
metadata:
  name: impersonation-demo
  namespace: sts-demo
spec:
  configMapName: sts-impersonation-demo
---
apiVersion: nais.io/v1
kind: OAuthImpersonation
metadata:
  name: impersonation-demo
  namespace: sts-demo
spec:
  allowedSubjects: [person1]
