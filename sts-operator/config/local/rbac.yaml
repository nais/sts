apiVersion: v1
kind: Namespace
metadata:
  name: sts-operator-dev
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sts-operator
  namespace: sts-operator-dev
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: sts-operator-dev
rules:
  - apiGroups: [nais.io]
    resources: [stsclients, stsclients/status, stsclients/finalizers]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: ["", events.k8s.io]
    resources: [events]
    verbs: [create, update, patch]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: sts-operator-dev
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: sts-operator-dev
subjects:
  - kind: ServiceAccount
    name: sts-operator
    namespace: sts-operator-dev
